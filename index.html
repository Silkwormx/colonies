<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f0a" />
<meta name="description" content="Two ants. One empty planet. Two years to make it a home. They’re going to need all the help they can get. Colonies — six illustrated missions on Mars." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Colonies</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #140c08;
  --bg-elev: #1f130d;
  --card: #27180f;
  --fg: #f6eadc;
  --muted: #c9a88a;
  --soft: #a8886c;
  --accent: #e8a05a;
  --accent-deep: #c9783a;
  --guide: #7eb8c9;
  --line: rgba(232, 160, 90, 0.22);
  --shadow: 0 18px 50px rgba(0,0,0,0.45);
  --radius: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Source Sans 3", system-ui, sans-serif;
  line-height: 1.5;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
button { font: inherit; }

/* ——— HERO ——— */
.hero {
  position: relative;
  min-height: min(92dvh, 920px);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
  isolation: isolate;
  background: #1a100c;
}
.hero-media {
  position: absolute; inset: 0; z-index: 0;
  overflow: hidden;
  background: #1a100c;
}
.hero-media img.now {
  position: absolute;
  /* bleed past edges so parallax/scale never shows a seam */
  top: -3%; right: -4%; bottom: -3%; left: -4%;
  width: auto; height: auto;
  min-width: 108%; min-height: 108%;
  object-fit: cover;
  /* keep ants + pod in the lower band, open sky for title */
  object-position: center 68%;
  transform: translate3d(0,0,0);
  will-change: transform;
}
.hero-media img.someday {
  display: none; /* someday lives in its own strip below — avoids blend seams */
}
.hero-vignette {
  position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(180deg,
      rgba(20,12,8,0.55) 0%,
      rgba(20,12,8,0.22) 18%,
      rgba(20,12,8,0.0) 38%,
      rgba(20,12,8,0.0) 62%,
      rgba(20,12,8,0.12) 85%,
      rgba(20,12,8,0.48) 100%);
  pointer-events: none;
}
.dust {
  position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
}
.dust span {
  position: absolute;
  border-radius: 50%;
  background: rgba(245, 172, 122, 0.95);
  box-shadow: 0 0 6px rgba(240, 150, 95, 0.6);
  animation: drift linear infinite;
  opacity: 0;
  will-change: transform, opacity;
}
.dust span.soft { background: rgba(232, 140, 90, 0.55); filter: blur(2.5px); box-shadow: none; }
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0); opacity: 0; }
  12%  { opacity: var(--o, 0.6); }
  50%  { transform: translate3d(var(--dx1, 30vw), var(--dy1, -6vh), 0); }
  88%  { opacity: calc(var(--o, 0.6) * 0.6); }
  100% { transform: translate3d(var(--dx2, 70vw), var(--dy2, -14vh), 0); opacity: 0; }
}
.dust::after {
  content: ""; position: absolute; left: -50%; right: -50%; bottom: 8%; height: 38%;
  background: radial-gradient(ellipse at center, rgba(220, 120, 70, 0.22), rgba(205,105,60,0) 70%);
  animation: haze 26s ease-in-out infinite alternate;
}
@keyframes haze { from { transform: translateX(-12%); opacity: .55; } to { transform: translateX(12%); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .dust span, .dust::after, .hero-media img { animation: none !important; transition: none !important; }
  .card:hover, .feed-btn:hover { transform: none !important; }
}
.hero-copy {
  position: relative; z-index: 3;
  padding: clamp(1.6rem, 4.5vh, 2.6rem) 1.4rem 0.85rem;
  max-width: 680px;
  margin: 0 auto;
  text-align: center;
  width: 100%;
  align-self: start;
}
.hero-copy::before {
  content: "";
  position: absolute;
  z-index: -1;
  left: 50%;
  top: 50%;
  width: 180%;
  height: 220%;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side,
    rgba(20,12,8,0.42) 0%,
    rgba(20,12,8,0.26) 40%,
    rgba(20,12,8,0.10) 70%,
    rgba(20,12,8,0) 100%);
  filter: blur(18px);
  pointer-events: none;
}
.hero-spacer {
  flex: 1 1 auto;
  min-height: clamp(28vh, 36vh, 46vh);
  pointer-events: none;
}
@media (max-width: 520px) {
  .hero-media img.now { object-position: center 70%; }
  .hero-spacer { min-height: clamp(26vh, 32vh, 40vh); }
  .hero-copy h1 { font-size: clamp(2.6rem, 14vw, 3.4rem); }
  .hero-copy { padding-top: 1.75rem; }
}
.eyebrow {
  font-size: clamp(0.62rem, 1.5vw, 0.74rem);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #f0d4a8;
  font-weight: 600;
  margin-bottom: 0.85rem;
  text-shadow: 0 1px 8px rgba(20,12,8,0.65);
  max-width: 36rem;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.35;
}
@media (min-width: 720px) {
  .eyebrow {
    white-space: nowrap;
    letter-spacing: 0.2em;
    font-size: 0.72rem;
  }
}
.hero-copy h1 {
  font-family: Fraunces, Georgia, serif;
  font-weight: 600;
  font-size: clamp(3rem, 12vw, 5.2rem);
  letter-spacing: -0.02em;
  line-height: 1.02;
  text-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 0 60px rgba(232,160,90,0.18);
}
.tagline {
  margin-top: 0.55rem;
  font-family: Fraunces, Georgia, serif;
  font-style: italic;
  font-weight: 500;
  color: #f3e2c4;
  font-size: clamp(1rem, 3.2vw, 1.25rem);
  opacity: 1;
  text-shadow:
    0 1px 0 rgba(20,12,8,0.35),
    0 2px 12px rgba(20,12,8,0.75),
    0 0 28px rgba(20,12,8,0.45);
}
.premise {
  margin: 0.7rem auto 0;
  max-width: 26rem;
  color: #e2c9ae;
  font-size: 0.98rem;
  font-weight: 400;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(20,12,8,0.75);
}

.hero-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 1.15rem auto 0;
  min-height: 48px;
  padding: 0.8rem 1.45rem;
  border-radius: 999px;
  font-family: "Source Sans 3", system-ui, sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-decoration: none;
  color: #1a0f0a;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  box-shadow: 0 14px 36px rgba(201,120,58,0.35);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  position: relative;
  z-index: 3;
}
.hero-cta:hover, .hero-cta:focus-visible {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 20px 44px rgba(201,120,58,0.45);
  outline: none;
}

.scroll-cue {
  margin-top: 0;
  padding-bottom: 1.6rem;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--soft);
  opacity: 0.85;
  position: relative; z-index: 3;
  text-align: center;
}

/* ——— SECTIONS ——— */
.section {
  padding: 2.75rem 0 1rem;
}
.section-head {
  padding: 0 1.35rem 1.1rem;
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  max-width: 1100px; margin: 0 auto;
}
.section-head h2 {
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(1.45rem, 4vw, 1.9rem);
  font-weight: 600;
}
.section-head p {
  color: var(--soft);
  font-size: 0.92rem;
}


/* ——— WHY COLONIES ——— */
.why {
  max-width: 720px;
  margin: 0 auto;
  padding: 2.1rem 1.35rem 0.35rem;
}
.why .eyebrow {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; margin-bottom: 0.55rem;
}
.why h2 {
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(1.45rem, 4vw, 1.9rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}
.why p {
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.55;
  max-width: 38rem;
}
.why p + p { margin-top: 0.7rem; }

/* ——— MISSION RAIL ——— */
.rail-wrap { position: relative; }
.rail {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(78vw, 320px);
  gap: 1rem;
  overflow-x: auto;
  padding: 0.35rem 1.35rem 1.6rem;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: 1.35rem;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
@media (min-width: 720px) {
  .rail { grid-auto-columns: minmax(300px, 340px); }
}
@media (min-width: 900px) {
  .rail { grid-auto-columns: minmax(320px, 360px); padding-left: max(1.35rem, calc((100vw - 1100px) / 2 + 1.35rem)); padding-right: max(1.35rem, calc((100vw - 1100px) / 2 + 1.35rem)); }
}

.card {
  scroll-snap-align: start;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column;
  transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  position: relative;
  min-height: 100%;
}
.card:hover, .card:focus-visible {
  transform: translateY(-6px);
  box-shadow: 0 26px 60px rgba(0,0,0,0.55);
  border-color: rgba(232,160,90,0.45);
  outline: none;
}
.card-art {
  position: relative;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: #2a1810;
}
.card-art img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s ease;
}
.card:hover .card-art img { transform: scale(1.04); }
.card-body {
  padding: 1.05rem 1.15rem 1.25rem;
  display: flex; flex-direction: column; gap: 0.35rem; flex: 1;
  min-height: 148px;
}
.card-num {
  font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.card-body h3 {
  font-family: Fraunces, Georgia, serif;
  font-size: 1.28rem; font-weight: 600; line-height: 1.15;
}
.card-body p {
  color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem;
}
.badge-open {
  display: inline-flex; align-self: flex-start;
  margin-top: 0.7rem;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #1a0f0a; padding: 0.38rem 0.7rem; border-radius: 999px;
}
.card.locked { cursor: default; }
.card.locked:hover { transform: none; box-shadow: var(--shadow); border-color: var(--line); }
.card.locked .card-art::after {
  content: "";
  position: absolute; inset: 0;
  backdrop-filter: blur(7px) saturate(0.85);
  -webkit-backdrop-filter: blur(7px) saturate(0.85);
  background: linear-gradient(180deg, rgba(30,18,12,0.25), rgba(20,12,8,0.55));
}
.frost-label {
  position: absolute; z-index: 2; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 700; color: var(--fg);
  background: rgba(26,15,10,0.55);
  border: 1px solid rgba(244,230,212,0.25);
  padding: 0.55rem 0.9rem; border-radius: 999px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  white-space: nowrap;
}
.card.read .badge-open::after { content: " · Read"; }

/* ——— CREW + GUIDE ——— */
.crew {
  max-width: 1100px; margin: 0.5rem auto 0; padding: 0 1.35rem 1rem;
}
.crew-card {
  display: grid; gap: 1.25rem;
  grid-template-columns: 1fr;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(232,160,90,0.12), transparent 55%),
    var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  padding: 1.35rem;
  box-shadow: var(--shadow);
}
@media (min-width: 720px) {
  .crew-card { grid-template-columns: 240px 1fr; align-items: center; padding: 1.5rem 1.6rem; }
}
.crew-faces {
  display: flex;
  gap: 1rem;
  justify-content: center;
  align-items: flex-start;
}
.crew-person {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.45rem;
  width: 96px;
}
.face {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 35%;
  border: 2px solid rgba(232,160,90,0.5);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  background: #2a1810;
  display: block;
}
.crew-name {
  font-family: Fraunces, Georgia, serif;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: 0.01em;
  text-align: center;
}
@media (min-width: 720px) {
  .crew-person { width: 104px; }
  .face { width: 96px; height: 96px; }
}
.crew-text h3 {
  font-family: Fraunces, Georgia, serif;
  font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem;
}
.crew-text .who { color: var(--muted); font-size: 0.95rem; margin-bottom: 0.9rem; }
.guide-box {
  border-left: 3px solid var(--guide);
  padding: 0.55rem 0 0.55rem 0.95rem;
  background: linear-gradient(90deg, rgba(126,184,201,0.08), transparent);
  border-radius: 0 12px 12px 0;
}
.guide-box .label {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--guide); margin-bottom: 0.25rem;
}
.guide-box .guide-title {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--guide); opacity: 0.85; margin-bottom: 0.35rem;
}
.guide-box .guide-topic {
  font-family: 'Fraunces', Georgia, serif; font-weight: 600;
  font-size: 1.15rem; color: var(--fg); margin-bottom: 0.3rem;
}
.guide-box p { color: var(--fg); font-size: 0.98rem; max-width: 42rem; }

/* ——— SOMEDAY STRIP ——— */
.someday {
  max-width: 1100px; margin: 1.5rem auto 0; padding: 0 1.35rem;
}
.someday-inner {
  position: relative; overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  min-height: 160px;
  box-shadow: var(--shadow);
}
.someday-inner img {
  width: 100%; height: 220px; object-fit: cover;
  object-position: center 42%;
  filter: saturate(0.95) brightness(0.88);
}
.someday-cap {
  position: absolute; inset: auto 0 0 0;
  padding: 1.35rem 1.2rem 1.15rem;
  background: linear-gradient(transparent, rgba(20,12,8,0.55) 35%, rgba(20,12,8,0.92));
}
.someday-cap span {
  font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.someday-cap p {
  font-family: Fraunces, Georgia, serif;
  font-size: 1.15rem; margin-top: 0.2rem;
}

/* ——— CTA ——— */
.cta {
  text-align: center;
  padding: 2.5rem 1.35rem 3.25rem;
  padding-bottom: calc(3.25rem + var(--safe-b));
}
.feed-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  background: linear-gradient(135deg, #f0b06a, var(--accent-deep));
  color: #1a0f0a; font-weight: 700; font-size: 1.05rem;
  text-decoration: none;
  padding: 0.95rem 1.7rem; border-radius: 999px;
  box-shadow: 0 14px 36px rgba(201,120,58,0.35);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.feed-btn:hover, .feed-btn:focus-visible {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 20px 44px rgba(201,120,58,0.45);
  outline: none;
}
.cta .note {
  margin-top: 0.85rem; color: var(--soft); font-size: 0.88rem;
}
footer.app-foot {
  text-align: center; color: var(--soft);
  font-size: 0.78rem; padding: 0 1rem 2rem;
  letter-spacing: 0.04em;
}

.hero-cta-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
  margin-top: 0.85rem;
}
.hero-cta-wrap .hero-cta { margin-top: 0; }
#watchIntroBtn {
  min-height: 52px;
  padding: 0.9rem 1.65rem;
  font-size: 1.02rem;
  gap: 0.55rem;
  border: 0;
  cursor: pointer;
}
.cta-play {
  display: inline-block;
  width: 0; height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 12px solid currentColor;
  margin-right: 0.15rem;
}
.hero-cta-secondary {
  min-height: 40px;
  padding: 0.5rem 1.15rem;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #f3e2c4;
  background: rgba(26,15,10,0.55);
  border: 1px solid rgba(232,160,90,0.45);
  box-shadow: none;
}
.hero-cta-secondary:hover, .hero-cta-secondary:focus-visible {
  transform: translateY(-2px);
  background: rgba(40,24,16,0.72);
  box-shadow: 0 10px 24px rgba(0,0,0,0.28);
  outline: none;
}


.intro-end {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.75rem; padding: 1.25rem;
  background: rgba(10,6,4,0.62);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.intro-end[hidden] { display: none !important; }
.intro-end .intro-end-primary {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0.8rem 1.45rem; border-radius: 999px;
  font-weight: 700; font-size: 0.98rem; text-decoration: none;
  color: #1a0f0a;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  box-shadow: 0 14px 36px rgba(201,120,58,0.4);
  border: 0; cursor: pointer;
}
.intro-end .intro-end-primary:focus-visible { outline: 2px solid #f6eadc; outline-offset: 3px; }
.intro-end .intro-end-again {
  min-height: 40px; padding: 0.45rem 1.1rem; border-radius: 999px;
  border: 1px solid rgba(232,160,90,0.5);
  background: rgba(26,15,10,0.7); color: #f3e2c4;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer;
}
.intro-end .intro-end-again:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.intro-modal-dialog { /* ensure positioning context for overlay */ }

/* Intro video modal */
.intro-modal[hidden] { display: none !important; }
.intro-modal {
  position: fixed; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  background: rgba(10,6,4,0.78);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.intro-modal-dialog {
  position: relative;
  width: min(920px, 100%);
  background: #1a100c;
  border: 1px solid rgba(232,160,90,0.35);
  border-radius: 18px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.55);
  overflow: hidden;
}
.intro-modal-close {
  position: absolute; top: 0.55rem; right: 0.55rem; z-index: 2;
  width: 44px; height: 44px; border-radius: 999px;
  border: 1px solid rgba(232,160,90,0.45);
  background: rgba(26,15,10,0.85); color: #f6eadc;
  font-size: 1.35rem; line-height: 1; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.intro-modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.intro-modal video {
  display: block; width: 100%; height: auto; max-height: min(78dvh, 560px);
  background: #0c0806; vertical-align: top;
}
.intro-modal-caption {
  padding: 0.65rem 1rem 0.85rem;
  font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--soft); text-align: center;
}
.premise .pl{display:block;text-wrap:balance}
/* One-screen home: no scroll */
html, body { height: 100%; }
body.home { min-height: 0; height: 100dvh; overflow: hidden; }
.hero { height: 100dvh; min-height: 0; }
.hero-spacer { min-height: 0 !important; }
.hero-actions { position: relative; z-index: 3; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
  margin: 1.05rem auto 0; max-width: 560px; }
.hero-actions .hero-cta { margin: 0; min-height: 44px; padding: 0.5rem 1.05rem; font-size: 0.86rem; font-weight: 600;
  letter-spacing: 0.03em; gap: 0.45rem; color: #f3e2c4; background: rgba(20,12,8,0.6); border: 1px solid rgba(232,160,90,0.5);
  box-shadow: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hero-actions #watchIntroBtn { min-height: 44px; padding: 0.5rem 1.05rem; font-size: 0.86rem; }
.hero-actions .cta-play { border-top-width: 5px; border-bottom-width: 5px; border-left-width: 9px; margin-right: 0; }
@media (max-height: 700px) {
  .hero-copy { padding-top: 1.1rem !important; }
  .hero-copy h1 { font-size: clamp(2.3rem, 11vw, 3rem) !important; }
  .eyebrow { margin-bottom: 0.5rem; }
  .hero-actions { margin-top: 0.8rem; }
}
</style>
</head>
<body class="home">
<header class="hero" id="top">
  <div class="hero-media" id="heroMedia">
    <img src="hero-landing.jpg" alt="Bare Mars landing site — the colony begins" class="now" />
    <img src="hero-someday.jpg" alt="" class="someday" aria-hidden="true" />
  </div>
  <div class="hero-vignette"></div>
  <div class="dust" id="dust" aria-hidden="true"></div>
  <div class="hero-copy">
    <div class="eyebrow">Building a new home on another world</div>
    <h1>Colonies</h1>
    <p class="premise"><span class="pl">Two ants. One empty planet. Two years to make it a home.</span> <span class="pl">They’re going to need all the help they can get.</span></p>
    <nav class="hero-actions" aria-label="Start here">
      <a class="hero-cta hero-cta-secondary" id="aboutBtn" href="about.html">About Colonies</a>
      <button type="button" class="hero-cta hero-cta-secondary" id="watchIntroBtn"><span class="cta-play" aria-hidden="true"></span>Watch the intro</button>
      <a class="hero-cta hero-cta-secondary" id="missionStartBtn" href="missions.html">Begin the adventure</a>
    </nav>
  </div>
  <div class="hero-spacer" aria-hidden="true"></div>
</header>


<div class="intro-modal" id="introModal" hidden role="dialog" aria-modal="true" aria-labelledby="introModalTitle">
  <div class="intro-modal-dialog" role="document">
    <button type="button" class="intro-modal-close" id="introModalClose" aria-label="Close">&times;</button>
    <div class="intro-video-wrap" style="position:relative">
      <video id="introVideo"
        src="mission1/intro/intro.mp4"
        poster="mission1/intro/intro_poster.jpg"
        playsinline
        controls
        preload="metadata"></video>
      <div class="intro-end" id="introEnd" hidden>
        <a class="intro-end-primary" id="introEndStart" href="missions.html">Begin the adventure</a>
        <button type="button" class="intro-end-again" id="introEndAgain">Watch again</button>
      </div>
    </div>
    <div class="intro-modal-caption" id="introModalTitle">Colonies · Series intro</div>
  </div>
</div>


<script>
(function () {
  // dust particles
  const dust = document.getElementById('dust');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (dust && !reduce) {
    const count = window.innerWidth < 600 ? 34 : 56;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      const soft = Math.random() < 0.3;
      if (soft) s.className = 'soft';
      const size = soft ? (5 + Math.random() * 6) : (1.5 + Math.random() * 3);
      s.style.width = s.style.height = size + 'px';
      s.style.left = (-15 + Math.random() * 60) + '%';
      s.style.top = (10 + Math.random() * 85) + '%';
      s.style.setProperty('--dx1', (25 + Math.random() * 30) + 'vw');
      s.style.setProperty('--dx2', (60 + Math.random() * 50) + 'vw');
      s.style.setProperty('--dy1', (-2 - Math.random() * 8) + 'vh');
      s.style.setProperty('--dy2', (-6 - Math.random() * 14) + 'vh');
      s.style.setProperty('--o', (0.55 + Math.random() * 0.4).toFixed(2));
      s.style.animationDuration = (12 + Math.random() * 18) + 's';
      s.style.animationDelay = (-Math.random() * 25) + 's';
      dust.appendChild(s);
    }
  }
  // gentle parallax
  const heroImg = document.querySelector('.hero-media img.now');
  if (heroImg && !reduce) {
    window.addEventListener('scroll', () => {
      const y = Math.min(window.scrollY, 500);
      heroImg.style.transform = 'translate3d(0,' + (y * 0.1) + 'px,0)';
    }, { passive: true });
  }
  // Single source for mission cards + hero "Start/Continue" button.
  // To open a new mission: set open:true on its entry (and ship its path).
  const MISSIONS = [
    { id: 'm1', n: 1, title: "Can't Breathe", blurb: "Six hours of air. The manual didn't land.", path: 'mission1/index.html', cover: 'covers/m1.jpg', alt: 'Mission 1 cover: oxygen gauge at the landing pod', open: true },
    { id: 'm2', n: 2, title: 'Too Cold', blurb: 'Air is solved. Heat is not. Nights here have opinions.', path: 'mission2/index.html', cover: 'covers/m2.jpg', alt: '', open: false },
    { id: 'm3', n: 3, title: 'Radiation', blurb: 'The sky forgets to filter. Dirt becomes architecture.', path: 'mission3/index.html', cover: 'covers/m3.jpg', alt: '', open: false },
    { id: 'm4', n: 4, title: 'No Soil', blurb: 'Regolith is not dirt. The first sprout negotiates terms.', path: 'mission4/index.html', cover: 'covers/m4.jpg', alt: '', open: false },
    { id: 'm5', n: 5, title: 'Dust Storm', blurb: 'The horizon stands up and walks toward the panels.', path: 'mission5/index.html', cover: 'covers/m5.jpg', alt: '', open: false },
    { id: 'm6', n: 6, title: 'The Dome', blurb: 'Glass rises. Someday, a forest under it.', path: 'mission6/index.html', cover: 'covers/m6.jpg', alt: '', open: false }
  ];

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function renderMissions(){
    const rail = document.getElementById('missionRail');
    const startBtn = document.getElementById('missionStartBtn');
    let read = [];
    try { read = JSON.parse(localStorage.getItem('colonies_read_missions') || '[]'); } catch (e) {}
    if (!rail) return;
    rail.innerHTML = '';
    MISSIONS.forEach((m) => {
      const num = 'Mission ' + pad2(m.n);
      if (m.open) {
        const a = document.createElement('a');
        a.className = 'card' + (read.includes(m.id) ? ' read' : '');
        a.href = m.path;
        a.dataset.mission = m.id;
        a.innerHTML =
          '<div class="card-art"><img src="' + m.cover + '" alt="' + (m.alt || '') + '" /></div>' +
          '<div class="card-body">' +
            '<div class="card-num">' + num + '</div>' +
            '<h3>' + m.title + '</h3>' +
            '<p>' + m.blurb + '</p>' +
            '<span class="badge-open">Open story</span>' +
          '</div>';
        rail.appendChild(a);
      } else {
        const d = document.createElement('div');
        d.className = 'card locked';
        d.setAttribute('aria-disabled', 'true');
        d.innerHTML =
          '<div class="card-art">' +
            '<img src="' + m.cover + '" alt="" />' +
            '<div class="frost-label">Coming soon</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-num">' + num + '</div>' +
            '<h3>' + m.title + '</h3>' +
            '<p>' + m.blurb + '</p>' +
          '</div>';
        rail.appendChild(d);
      }
    });

    applyMissionCta(startBtn);
    applyMissionCta(document.getElementById('introEndStart'));
  }

  function missionCta(){
    let read = [];
    try { read = JSON.parse(localStorage.getItem('colonies_read_missions') || '[]'); } catch (e) {}
    const openOnes = MISSIONS.filter((m) => m.open);
    const unread = openOnes.find((m) => !read.includes(m.id));
    const newestOpen = openOnes.length ? openOnes[openOnes.length - 1] : null;
    const target = unread || newestOpen;
    if (!target) return null;
    const label = (unread && read.length)
      ? 'Continue the adventure'
      : 'Begin the adventure';
    return { path: target.path, label: label };
  }
  function applyMissionCta(el){
    if (!el) return;
    const c = missionCta();
    if (!c) return;
    if (el.tagName === 'A') el.setAttribute('href', 'missions.html');
    el.textContent = c.label;
  }
  renderMissions();
  applyMissionCta(document.getElementById('missionStartBtn'));
  // PWA

  // Watch the intro modal (+ end overlay)
  const introModal = document.getElementById('introModal');
  const introVideo = document.getElementById('introVideo');
  const watchBtn = document.getElementById('watchIntroBtn');
  const closeBtn = document.getElementById('introModalClose');
  const introEnd = document.getElementById('introEnd');
  const introEndStart = document.getElementById('introEndStart');
  const introEndAgain = document.getElementById('introEndAgain');
  let introLastFocus = null;
  function setIntroControls(on){
    if (!introVideo) return;
    if (on) introVideo.setAttribute('controls', '');
    else introVideo.removeAttribute('controls');
  }
  function hideIntroEnd(){
    if (introEnd) introEnd.hidden = true;
    setIntroControls(true);
  }
  function showIntroEnd(){
    if (!introEnd) return;
    applyMissionCta(introEndStart);
    setIntroControls(false);
    introEnd.hidden = false;
    if (introEndStart) introEndStart.focus();
  }
  function openIntro() {
    if (!introModal) return;
    introLastFocus = document.activeElement;
    hideIntroEnd();
    introModal.hidden = false;
    document.body.style.overflow = 'hidden';
    try { introVideo.currentTime = 0; } catch (e) {}
    const p = introVideo.play();
    if (p && p.catch) p.catch(() => {});
    (closeBtn || introModal).focus();
  }
  function closeIntro() {
    if (!introModal || introModal.hidden) return;
    try { introVideo.pause(); introVideo.currentTime = 0; } catch (e) {}
    hideIntroEnd();
    introModal.hidden = true;
    document.body.style.overflow = '';
    if (introLastFocus && introLastFocus.focus) introLastFocus.focus();
  }
  if (watchBtn) watchBtn.addEventListener('click', openIntro);
  if (closeBtn) closeBtn.addEventListener('click', closeIntro);
  if (introModal) {
    introModal.addEventListener('click', (e) => { if (e.target === introModal) closeIntro(); });
  }
  if (introVideo) {
    introVideo.addEventListener('ended', showIntroEnd);
    introVideo.addEventListener('play', hideIntroEnd);
  }
  if (introEndAgain) {
    introEndAgain.addEventListener('click', () => {
      hideIntroEnd();
      try { introVideo.currentTime = 0; } catch (e) {}
      const p = introVideo.play();
      if (p && p.catch) p.catch(() => {});
    });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && introModal && !introModal.hidden) { e.preventDefault(); closeIntro(); }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
