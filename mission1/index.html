<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Colonies — Mission 1: Can't Breathe</title>
<link rel="manifest" href="../manifest.json" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#140c08; --card:#1f130d; --fg:#f6eadc; --muted:#c9a88a; --soft:#a8886c;
  --accent:#e8a05a; --accent-deep:#c9783a; --line:rgba(232,160,90,.28);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Source Sans 3",system-ui,sans-serif;min-height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit} img{display:block;max-width:100%;height:auto}
.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:calc(.55rem + var(--safe-t)) .75rem .45rem;z-index:20}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:.45rem .85rem;border-radius:999px;border:1px solid #8a5a32;background:rgba(26,15,10,.78);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#1a0f0a;border:none}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:.4rem;opacity:.7}
.stage-wrap{flex:1 1 auto;position:relative;min-height:0;perspective:1600px;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 .9rem .35rem;transform-origin:left center;will-change:transform,opacity}
.stage.turn-out-next{animation:turnOutNext .28s ease forwards}
.stage.turn-in-next{animation:turnInNext .28s ease}
.stage.turn-out-prev{animation:turnOutPrev .28s ease forwards}
.stage.turn-in-prev{animation:turnInPrev .28s ease}
@keyframes turnOutNext{from{transform:rotateY(0) translateX(0);opacity:1}to{transform:rotateY(-18deg) translateX(-18%);opacity:0}}
@keyframes turnInNext{from{transform:rotateY(16deg) translateX(22%);opacity:0}to{transform:rotateY(0) translateX(0);opacity:1}}
@keyframes turnOutPrev{from{transform:rotateY(0) translateX(0);opacity:1}to{transform:rotateY(18deg) translateX(18%);opacity:0}}
@keyframes turnInPrev{from{transform:rotateY(-16deg) translateX(-22%);opacity:0}to{transform:rotateY(0) translateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.stage.turn-out-next,.stage.turn-in-next,.stage.turn-out-prev,.stage.turn-in-prev{animation:none}}
.page-art{flex:1 1 auto;min-height:0;border-radius:16px;overflow:hidden;background:#2a1810;border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.page-art img{width:100%;height:100%;object-fit:cover}
.page-art.logish{
  background:radial-gradient(ellipse at 50% 28%, #4a2a18 0%, transparent 60%), var(--card);
  flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;
  padding:1.25rem 1.15rem; gap:.75rem; overflow:auto; -webkit-overflow-scrolling:touch;
}
.page-art.logish::before,.page-art.logish::after{content:"";flex:1 1 0;min-height:0;pointer-events:none}
.page-scene{
  flex:1 1 auto;min-height:0;border-radius:16px;overflow:auto;background:#1a100c;
  border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:flex-start;
  -webkit-overflow-scrolling:touch;
}
/* Vertical center when content is shorter than the card; spacers collapse to 0 when scrolling */
.page-scene::before,.page-scene::after{content:"";flex:1 1 0;min-height:0;pointer-events:none}
.page-scene .scene-art{
  flex:0 0 auto;overflow:hidden;background:transparent;line-height:0;
  border-bottom:1px solid var(--line);
}
.page-scene .scene-art img{
  width:100%;height:auto;display:block;
  object-fit:unset;
}
.page-scene .scene-log{
  flex:0 0 auto;overflow:visible;
  padding:0.55rem 0.85rem 0.7rem; display:flex; flex-direction:column; gap:.28rem;
  background:radial-gradient(ellipse at 50% 0%, #3a2214 0%, transparent 55%), var(--card);
}
.page-scene.note-page{background:#1a100c}
.page-scene.note-page .scene-art{background:#f3e6d0;border-bottom:1px solid rgba(90,58,34,.25)}
.page-scene.note-page .scene-art img{background:#f3e6d0}
.page-scene.note-page .scene-log{
  background:radial-gradient(ellipse at 50% 0%, #3a2214 0%, transparent 55%), var(--card);
}
.log-head{
  font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size:.68rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}
.log-body p{
  font-family:Fraunces, Georgia, serif;
  font-size:clamp(0.95rem, 3.4vw, 1.12rem);
  line-height:1.4; color:#f3e2c4;
}
.ra-active{background:rgba(232,160,90,.14);box-shadow:inset 3px 0 0 var(--accent);border-radius:3px;color:#ffe7c8!important}
.end-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.7rem 1.15rem;border-radius:999px;text-decoration:none;font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#1a0f0a}
.btn.ghost{border:1px solid rgba(232,160,90,.45)}
.nav{flex:0 0 auto;display:grid;grid-template-columns:44px 1fr 44px;gap:.55rem;align-items:center;padding:.35rem .75rem calc(.75rem + var(--safe-b))}
.nav-arrow{width:44px;height:44px;border-radius:50%;border:1px solid #8a5a32;background:rgba(26,15,10,.75);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav-arrow:disabled{opacity:.35;cursor:default}
.nav-arrow svg{width:18px;height:18px;fill:currentColor}
.page-meta{text-align:center;color:var(--soft);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:4px;margin-top:.35rem;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(232,160,90,.28);display:block}
.dots i.cur{background:var(--accent);transform:scale(1.25)}
.dots i.seen{background:rgba(232,160,90,.55)}
.hit{position:absolute;top:12%;bottom:18%;width:22%;z-index:12;background:transparent;border:0;padding:0;cursor:pointer}
.hit.left{left:0}.hit.right{right:0}
.fallback{position:fixed;left:50%;bottom:calc(1rem + var(--safe-b));transform:translateX(-50%);z-index:40;display:none;min-height:44px;padding:.7rem 1.1rem;border-radius:999px;border:1px solid var(--accent);background:rgba(26,15,10,.92)}
.fallback.show{display:inline-flex;align-items:center}

.scene-log,.page-art.logish{position:relative}
.box-audio{position:absolute;top:.35rem;right:.35rem;z-index:15;flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(126,184,201,0.6);background:rgba(16,24,30,0.9);color:#7eb8c9;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.box-audio svg{width:22px;height:22px;pointer-events:none}
.box-audio.is-playing,.box-audio[aria-pressed="true"]{background:rgba(126,184,201,0.32);border-color:#7eb8c9;color:#eaf6fa;box-shadow:0 0 0 3px rgba(126,184,201,0.4);animation:boxAudioPulse 1.2s ease-in-out infinite}
@keyframes boxAudioPulse{0%,100%{box-shadow:0 0 0 3px rgba(126,184,201,0.35)}50%{box-shadow:0 0 0 8px rgba(126,184,201,0)}}
.scene-log,.page-art.logish{padding-right:3.1rem}

.btn-audio{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(126,184,201,0.6);background:rgba(16,24,30,0.85);color:#7eb8c9;touch-action:manipulation}
.btn-audio svg{width:22px;height:22px;pointer-events:none}
.btn-audio .ico-off{display:none}
.btn-audio[aria-pressed="true"]{background:rgba(126,184,201,0.28);border-color:#7eb8c9;color:#eaf6fa;box-shadow:0 0 0 3px rgba(126,184,201,0.35)}
.btn-audio.is-off{color:var(--muted);border-color:rgba(232,160,90,0.45)}
.btn-audio.is-off .ico-spk{display:none}
.btn-audio.is-off .ico-off{display:block}
.btn-audio.needs-tap{animation:boxAudioPulse 1.2s ease-in-out infinite}
.topnav{display:flex;gap:.4rem;align-items:center}
@media (max-width:420px){.topbar{padding-left:.5rem;padding-right:.5rem;gap:.35rem}.topbar .pill{padding:.45rem .62rem;letter-spacing:.04em}.topnav{gap:.3rem}}
.start-overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:rgba(12,7,5,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;margin:.15rem .15rem .4rem}
.start-overlay.show{display:flex}
.start-overlay button{min-height:56px;padding:1rem 1.4rem;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#1a0f0a;font-weight:700;font-size:1.05rem;
  box-shadow:0 12px 32px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topnav">
      <a class="pill" href="../missions.html" aria-label="Back to missions" title="Back to missions">← Missions</a>
    </div>
    <button type="button" class="btn-audio" id="raToggle" aria-pressed="false" aria-label="Audio on. Read aloud" title="Read aloud"><svg class="ico-spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="start-overlay" id="startOverlay"><button type="button" id="startBtn">Tap to start reading</button></div>
    <button type="button" class="hit left" id="hitLeft" aria-label="Previous page"></button>
    <button type="button" class="hit right" id="hitRight" aria-label="Next page"></button>
  </div>
  <div class="nav">
    <button type="button" class="nav-arrow" id="prevBtn" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg></button>
    <div><div class="page-meta" id="pageMeta">1</div><div class="dots" id="dots"></div></div>
    <button type="button" class="nav-arrow" id="nextBtn" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m8.6 4.6-1.4 1.4 6 6-6 6 1.4 1.4L16 12z"/></svg></button>
  </div>
</div>
<button type="button" class="fallback" id="fallback">Sound off? Tap to enable</button>
<script>
(function(){
  try{const k='colonies_read_missions';const r=JSON.parse(localStorage.getItem(k)||'[]');if(!r.includes('m1')){r.push('m1');localStorage.setItem(k,JSON.stringify(r));}}catch(e){}
  const stage=document.getElementById('stage'), pageMeta=document.getElementById('pageMeta'), dots=document.getElementById('dots');
  const prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
  const raToggle=document.getElementById('raToggle'), fallback=document.getElementById('fallback');
  const startOverlay=document.getElementById('startOverlay'), startBtn=document.getElementById('startBtn');
  const hitLeft=document.getElementById('hitLeft'), hitRight=document.getElementById('hitRight');
  const audio=document.createElement('audio'); audio.setAttribute('playsinline',''); audio.preload='auto'; audio.style.display='none'; document.body.appendChild(audio);
  let book=null, pageIndex=0, token=0, turning=false, activeBtn=null;
  let readingAll=false, userStopped=false, autoTurnTimer=null;
  const AUDIO_KEY='colonies_audio_off';
  let audioOff=false;
  try{ audioOff = localStorage.getItem(AUDIO_KEY)==='1'; }catch(e){}
  if(audioOff) userStopped=true;
  const SPEAKER_SVG="<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 9v6h4l5 4V5L8 9H4z\" fill=\"currentColor\"/><path d=\"M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>";
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function syncAudioBtn(){
    if(!raToggle) return;
    raToggle.classList.toggle('is-off', audioOff);
    raToggle.setAttribute('aria-pressed', readingAll?'true':'false');
    raToggle.setAttribute('aria-label', audioOff ? 'Audio off. Tap to turn on' : (readingAll ? 'Audio on, reading. Tap to stop' : 'Audio on. Read aloud'));
    raToggle.title = audioOff ? 'Audio off' : 'Read aloud';
  }
  function setAudioOff(off){ audioOff=!!off; try{localStorage.setItem(AUDIO_KEY, off?'1':'0');}catch(e){} syncAudioBtn(); }
  syncAudioBtn();
  function setActive(el){document.querySelectorAll('.ra-active').forEach(n=>n.classList.remove('ra-active')); if(el) el.classList.add('ra-active');}
  function showFallback(retry){fallback.classList.add('show'); fallback.onclick=()=>{fallback.classList.remove('show'); if(retry) retry();};}
  function showStartOverlay(show){ if(startOverlay) startOverlay.classList.toggle('show', !!show); }
  function clearAutoTurn(){ if(autoTurnTimer){ clearTimeout(autoTurnTimer); autoTurnTimer=null; } }
  function setBtnPlaying(btn,on){
    if(!btn) return;
    btn.classList.toggle('is-playing', !!on);
    btn.setAttribute('aria-pressed', on?'true':'false');
    btn.setAttribute('aria-label', on?'Stop audio':'Play audio');
    btn.title = on?'Stop':'Play';
  }
  function stopVoice(){
    token++;
    clearAutoTurn();
    try{audio.pause();}catch(e){}
    try{audio.removeAttribute('src'); audio.src='';}catch(e){}
    try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
    setActive(null);
    if(activeBtn){ setBtnPlaying(activeBtn,false); activeBtn=null; }
  }
  function playSrc(src, expectSec, my){return new Promise(resolve=>{
    let done=false, wd=null;
    const fin=r=>{ if(done)return; done=true; clearTimeout(wd); clearInterval(poll);
      ['ended','error','stalled','playing'].forEach(ev=>audio.removeEventListener(ev,handlers[ev]));
      resolve(my!==token?'cancel':r); };
    const handlers={ ended:()=>fin('ok'), error:()=>{ if(!(audio.getAttribute('src')||audio.src||'').includes(src.split('/').pop())) return; fin('error'); }, stalled:()=>{}, playing:()=>{} };
    const poll=setInterval(()=>{ if(my!==token) fin('cancel'); }, 120);
    handlers.playing=()=>{ clearTimeout(wd);
      const d=(isFinite(audio.duration)&&audio.duration>0)?audio.duration:(expectSec||4);
      wd=setTimeout(()=>fin(audio.error?'error':'ok'), Math.round(d*1000/(audio.playbackRate||1))+2500); };
    ['ended','error','stalled','playing'].forEach(ev=>audio.addEventListener(ev,handlers[ev]));
    try{
      audio.src=src; audio.volume=1;
      wd=setTimeout(()=>fin('error'), 12000);
      const p=audio.play();
      if(p&&p.catch)p.catch(e=>{
        if(e&&e.name==='AbortError')return;
        fin(e&&e.name==='NotAllowedError'?'blocked':'error');
      });
    }catch(e){ fin('error'); }
  });}
  function speakFallback(text, my){return new Promise(resolve=>{
    if(my!==token) return resolve(false);
    let done=false; const fin=v=>{ if(!done){done=true; clearTimeout(t); resolve(v);} };
    const words=String(text||'').split(/\s+/).length;
    const t=setTimeout(()=>{ try{speechSynthesis.cancel();}catch(e){} fin(false); }, 2500+words*450);
    try{if(!window.speechSynthesis||!text)return fin(false);const u=new SpeechSynthesisUtterance(text);u.rate=.92;u.onend=()=>fin(true);u.onerror=()=>fin(false);speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){fin(false);}
  });}
  function renderDots(){dots.innerHTML=''; book.pages.forEach((_,i)=>{const d=document.createElement('i'); if(i===pageIndex)d.classList.add('cur'); if(i<pageIndex)d.classList.add('seen'); dots.appendChild(d);});}
  function kindLabel(pg){
    const k=pg.kind||'';
    if(k==='cover') return ' · Cover';
    if(k==='intro') return ' · Intro';
    if(k==='scene') return ' · '+(pg.title||'Log');
    if(k==='note') return ' · Note';
    if(k==='science') return ' · Science';
    if(k==='end') return ' · End';
    if(k==='log') return ' · Log '+(pg.title||'');
    if(k==='image') return ' · Image';
    return '';
  }
  function injectBoxAudio(){
    const box=stage.querySelector('.scene-log, .page-art.logish');
    if(!box) return;
    if(box.querySelector('.box-audio')) return;
    const pg=book.pages[pageIndex];
    const clips=(pg.clips||[]).filter(c=>!c.pause);
    if(!clips.length) return;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='box-audio';
    btn.setAttribute('aria-label','Play audio');
    btn.title='Play';
    btn.innerHTML=SPEAKER_SVG;
    btn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      if(btn.classList.contains('is-playing')){ stopVoice(); readingAll=false; syncAudioBtn(); return; }
      setReading(true, {remember:false});
      stopVoice();
      readPageOnly(btn);
    });
    btn.addEventListener('touchstart', function(e){ e.stopPropagation(); }, {passive:true});
    btn.addEventListener('touchend', function(e){ e.stopPropagation(); }, {passive:true});
    box.appendChild(btn);
  }
  async function playPageClips(btn){
    const pg=book.pages[pageIndex]; const clips=pg.clips||[]; const my=token;
    if(btn){ activeBtn=btn; setBtnPlaying(btn,true); }
    for(const it of clips){
      if(my!==token) return 'cancel';
      if(it.pause){ setActive(null); await sleep(Math.max(80, Math.round((it.duration||.45)*1000))); continue; }
      const el=stage.querySelector('[data-clip="'+it.id+'"]'); setActive(el);
      const r=await playSrc('audio/'+it.file, it.duration, my);
      if(my!==token || r==='cancel') return 'cancel';
      if(r==='blocked') return 'blocked';
      if(r==='error'){
        await speakFallback(it.speak||it.text||(el?el.textContent:''), my);
        if(my!==token) return 'cancel';
      }
    }
    if(my===token){ setActive(null); if(btn){ setBtnPlaying(btn,false); if(activeBtn===btn) activeBtn=null; } }
    return my===token ? 'ok' : 'cancel';
  }
  async function readPageOnly(btn){
    const my=token;
    const r=await playPageClips(btn);
    if(my!==token) return;
    if(r==='blocked'){ showFallback(()=>readPageOnly(btn)); return; }
  }
  async function readFromHere(){
    const my=token;
    const r=await playPageClips(null);
    if(my!==token || !readingAll) return;
    if(r==='blocked'){
      setReading(false,{remember:false});
      showStartOverlay(true);
      armGestureStart();
      return;
    }
    const pg=book.pages[pageIndex];
    if(pg.kind==='end' || pageIndex>=book.pages.length-1){
      setReading(false,{remember:false});
      return;
    }
    clearAutoTurn();
    autoTurnTimer=setTimeout(()=>{
      autoTurnTimer=null;
      if(my!==token || !readingAll) return;
      if(pageIndex<book.pages.length-1) goTo(pageIndex+1,1);
    }, 1500);
  }
  function setReading(on, opts){
    opts=opts||{};
    readingAll=!!on;
    if(!on){
      stopVoice();
      if(opts.remember!==false){
        userStopped=true;
        setAudioOff(true);
      }
    } else {
      userStopped=false;
      if(audioOff) setAudioOff(false);
      showStartOverlay(false);
    }
    syncAudioBtn();
  }
  function toggleRead(){
    if(!audioOff && !startOverlay.classList.contains('show')){ setReading(false); return; }
    setReading(true); stopVoice();
    readFromHere();
  }
  function tryAutoStart(){
    if(userStopped || audioOff) return;
    setReading(true, {remember:false});
    readFromHere();
  }
  let gestureArmed=false;
  function armGestureStart(){
    if(gestureArmed || userStopped || audioOff) return;
    gestureArmed=true;
    const kick=(e)=>{
      if(e.target && e.target.closest && e.target.closest('#raToggle,#startBtn')) return;
      if(!gestureArmed) return;
      gestureArmed=false;
      document.removeEventListener('pointerdown', kick, true);
      document.removeEventListener('keydown', kick, true);
      showStartOverlay(false);
      if(!readingAll && !audioOff){ setReading(true,{remember:false}); stopVoice(); readFromHere(); }
    };
    document.addEventListener('pointerdown', kick, true);
    document.addEventListener('keydown', kick, true);
  }
  function renderPage(){
    const pg=book.pages[pageIndex], total=book.pages.length;
    pageMeta.textContent=(pageIndex+1)+' / '+total+kindLabel(pg);
    const isEnd=pg.kind==='end'; hitLeft.style.display=isEnd?'none':''; hitRight.style.display=isEnd?'none':'';
    if((pg.kind==='scene' || pg.kind==='note' || (pg.kind==='intro' && pg.img)) && pg.img && pg.html){
      const sketch=/note|intro2|intro3/.test(String(pg.img));
      const extra=sketch?' note-page':'';
      stage.innerHTML='<div class="page-scene'+extra+'"><div class="scene-art"><img src="'+pg.img+'" alt="'+(pg.alt||pg.title||'')+'"/></div><div class="scene-log">'+pg.html+'</div></div>';
    } else if(pg.img && !pg.html){
      stage.innerHTML='<div class="page-art"><img src="'+pg.img+'" alt="'+(pg.alt||'')+'"/></div>';
    } else {
      stage.innerHTML='<div class="page-art logish">'+(pg.html||'')+'</div>';
    }
    prevBtn.disabled=pageIndex<=0; nextBtn.disabled=pageIndex>=total-1; renderDots();
    injectBoxAudio();
  }
  let pendingTurn=null, turnTarget=0;
  async function goTo(i,dir){
    if(!book) return;
    if(i<0||i>=book.pages.length) return;
    if(turning){ pendingTurn={i,dir}; return; }
    if(i===pageIndex) return;
    turning=true; turnTarget=i;
    const keepReading=readingAll;
    stopVoice();
    readingAll=keepReading; syncAudioBtn();
    try{
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      const out=dir>=0?'turn-out-next':'turn-out-prev'; const inn=dir>=0?'turn-in-next':'turn-in-prev';
      stage.classList.remove('turn-in-next','turn-in-prev','turn-out-next','turn-out-prev');
      stage.classList.add(out); await sleep(reduce?0:150);
      pageIndex=i; renderPage();
      stage.classList.remove(out); stage.classList.add(inn); await sleep(reduce?0:150);
      stage.classList.remove(inn);
    } finally { turning=false; }
    if(pendingTurn){ const p=pendingTurn; pendingTurn=null; if(p.i!==pageIndex){ goTo(p.i,p.dir); return; } }
    if(readingAll && !audioOff) readFromHere();
  }
  const tgt=d=>Math.max(0,Math.min(book?book.pages.length-1:0,(pendingTurn?pendingTurn.i:(turning?turnTarget:pageIndex))+d));
  const next=()=>{ if(book) goTo(tgt(1),1); }, prev=()=>{ if(book) goTo(tgt(-1),-1); };
  function hitTurn(dir){
    return function(e){
      const hits=[hitLeft,hitRight];
      hits.forEach(h=>{ h.style.pointerEvents='none'; });
      const under=document.elementFromPoint(e.clientX, e.clientY);
      hits.forEach(h=>{ h.style.pointerEvents=''; });
      const btn=under && under.closest && under.closest('.box-audio');
      if(btn){ btn.click(); return; }
      if(under && under.closest && under.closest('a,.end-actions,#startOverlay,#raToggle')) return;
      if(dir>0) next(); else prev();
    };
  }
  prevBtn.onclick=prev; nextBtn.onclick=next; hitLeft.onclick=hitTurn(-1); hitRight.onclick=hitTurn(1);
  if(raToggle) raToggle.onclick=function(e){ e.preventDefault(); e.stopPropagation(); toggleRead(); };
  if(startBtn) startBtn.onclick=function(){ showStartOverlay(false); if(!readingAll) toggleRead(); };
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){e.preventDefault();next();}
    if(e.key==='ArrowLeft'){e.preventDefault();prev();}
    if(e.key===' '){e.preventDefault();toggleRead();}
  });
  let tx=null,ty=null; const wrap=document.getElementById('stageWrap');
  wrap.addEventListener('touchstart',e=>{
    if(e.target.closest&&e.target.closest('a,.end-actions,.box-audio,#raToggle,#startOverlay')){tx=ty=null;return;}
    const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;
  },{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(tx==null)return;
    if(e.target.closest&&e.target.closest('.box-audio,#raToggle')){tx=ty=null;return;}
    const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;tx=ty=null;
    if(Math.abs(dx)<48||Math.abs(dx)<Math.abs(dy)*1.2)return; if(dx<0)next(); else prev();
  },{passive:true});
  fetch('audio/manifest.json',{cache:'no-cache'}).then(r=>r.json()).then(m=>{
    book=m; if(!book.pages) throw 0; renderPage();
    setTimeout(()=>{ tryAutoStart(); if(!readingAll && !audioOff) armGestureStart(); }, 80);
  }).catch(()=>{stage.innerHTML='<div class="page-art logish"><p>Could not load the log.</p></div>';});
})();
</script>
