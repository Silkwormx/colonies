<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#f3e6d0"/>
  <rect x="90" y="30" width="240" height="280" rx="12" fill="none" stroke="#5a3a22" stroke-width="3"/>
  <rect x="100" y="120" width="220" height="180" fill="#7eb6e8" opacity="0.55"/>
